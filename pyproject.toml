[project]
name = "health-sync"
version = "0.3.0"
description = "Sync and export health and fitness data between services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect",
    "gspread",
    "google-auth",
    "google-kit @ https://github.com/ExiosV/google-kit/archive/refs/tags/v0.1.0.tar.gz",
    "requests",
    "python-dotenv",
]

[project.scripts]
health-sync = "health_sync.cli:main"

[tool.setuptools]
packages = ["health_sync", "health_sync.core", "health_sync.connectors"]
